# CI 检查：对 PR 引入的每个提交运行 commitlint。
# 放在哪里：<your-repo>/.github/workflows/commit-message-policy.yml
# 本地钩子可以用 --no-verify 跳过，这个检查在 PR 上补一道；
# 要让它真正拦住合并，需要在分支保护里把 “commit-message-policy” 登记为必需检查，
# 并写进 <your-repo>/.github/branch-protection.expected.json。
#
# 要改的地方：
# 1. branches：示例里 dev 是集成分支，换成你的。
# 2. node-version：与项目一致。
name: Commit message policy

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-message-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in this PR
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
